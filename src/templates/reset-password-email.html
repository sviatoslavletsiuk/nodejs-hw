<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Reset</title>
  </head>
  <body>
    <h1>Password Reset Request</h1>
    <p>Hi {{name}},</p>
    <p>
      You requested a password reset. Click the button below to set a new
      password.
    </p>
    <p>
      <a
        href="{{resetUrl}}"
        style="
          display: inline-block;
          padding: 12px 24px;
          background: #007bff;
          color: #fff;
          text-decoration: none;
          border-radius: 4px;
        "
      >
        Reset Password
      </a>
    </p>
    <p>If you did not request this email, ignore it.</p>
  </body>
</html>
